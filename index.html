<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire-Mythos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importação de fonte similar (EB Garamond) do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="grimoire-container">
        <header>
            <h1>O Grande Grimório da Magia do Mythos</h1>
            <p class="subtitle">Índice e Filtro de Feitiços — Chamado de Cthulhu 7ª Edição</p>
        </header>

        <div class="search-filter-box">
            <div class="input-group">
                <label for="searchBox">Pesquisar por Nome:</label>
                <input type="text" id="searchBox" placeholder="Ex: Abraço de Nyogtha...">
            </div>
            <div class="input-group">
                <label for="categoryFilter">Filtrar por Categoria:</label>
                <select id="categoryFilter">
                    <option value="">Todas as Categorias</option>
                    <option value="Ambientais">Ambientais</option>
                    <option value="Banimento ou Controle">Banimento ou Controle</option>
                    <option value="Combate">Combate</option>
                    <option value="Comunicação">Comunicação</option>
                    <option value="Convocação">Convocação de Monstros e Deuses</option>
                    <option value="Criação de Monstros">Criação de Monstros</option>
                    <option value="Encantamentos">Encantamentos</option>
                    <option value="Folclórico">Folclórico</option>
                    <option value="Influenciadores">Influenciadores</option>
                    <option value="Nocivos">Nocivos</option>
                    <option value="Proteção">Proteção</option>
                    <option value="Temporais">Temporais</option>
                    <option value="Terras Oníricas">Terras Oníricas</option>
                    <option value="Transformação">Transformação</option>
                    <option value="Viagem e Transporte">Viagem e Transporte</option>
                </select>
            </div>
        </div>

        <main>
            <div class="sumario-table" id="spellList">
                <!-- Os itens serão injetados dinamicamente via script.js -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">Nenhum feitiço encontrado com os critérios informados.</div>
        </main>

        <footer>
            <p>Grimoire-Mythos &bull; Baseado no material da Chaosium e Editora NewOrder</p>
        </footer>
    </div>

    <script src="spells-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
